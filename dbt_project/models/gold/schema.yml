version: 2

models:
  - name: dim_date
    description: Təqvim dimension-u, 2026-ci ilin bütün günləri.
    columns:
      - name: date_key
        description: Surrogate key (YYYYMMDD tam ədəd formatında).
        tests:
          - not_null
          - unique

  - name: dim_product
    description: >
      Məhsul dimension-u — tarixçəsiz, natural key (`product_id`) həm də surrogate key kimi işlədilir.
      `silver.products`-dan yox, `stg_products`-dan qurulur: dimension fact-ın istinad edə biləcəyi
      BÜTÜN məhsulları örtməlidir, əks halda kataloq qüsuruna görə karantinə düşmüş məhsulun sifarişləri
      join-dan düşüb gəliri sükutla itirir. Qüsurlu kataloq atributları `null`-lanır və
      `has_catalog_issue` ilə işarələnir; dublikat və ID-siz sətirlər isə kənarda qalır.
    columns:
      - name: product_id
        description: Məhsul ID-si, surrogate key kimi də istifadə olunur.
        tests:
          - not_null
          - unique
      - name: has_catalog_issue
        description: Məhsulun kataloq sətri DQ yoxlamasından keçməyib (mənfi/boş qiymət, dəstəklənməyən valyuta) — atributları `null`-dır.

  - name: dim_customer
    description: >
      Müştəri dimension-u, SCD Type 2. İki snapshot (2026-08-24, 2026-08-25) müqayisə
      olunub — sahə dəyişikliyi olan müştərilər üçün 2 versiya, yox olan müştəri üçün
      is_current=false. İlk versiyanın valid_from-u 2020-01-01-ə sabitlənib ki, avqustdan
      əvvəlki sifarişlər də bir versiyaya uyğunlaşa bilsin (real tarixçəmiz yalnız 2 gündür).
    columns:
      - name: customer_key
        description: Surrogate key — md5(customer_id + valid_from). Natural key SCD2-də təkrarlandığı üçün lazımdır.
        tests:
          - not_null
          - unique
      - name: customer_id
        description: Natural key.
        tests:
          - not_null

  - name: fct_order_lines
    description: >
      Sifariş sətri fact cədvəli, grain = (order_id, line_number). gross_amount_azn
      point-in-time FX (as-of-backward) ilə hesablanıb. is_recognized = final_status
      CANCELLED/REFUNDED olmadıqda true (kanonik qayda 3).
    columns:
      - name: order_id
        tests:
          - not_null
      - name: line_number
        tests:
          - not_null
      - name: product_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_id
      - name: customer_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key
      - name: order_date_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: gross_amount_azn
        description: AZN-ə çevrilmiş ümumi məbləğ (quantity * unit_price * rate_azn).
        tests:
          - not_null

  - name: fct_order_status_events
    description: Status event fact cədvəli, grain = event_id (silver.order_status_history-in eynisi, dimension key-lərlə zənginləşdirilib).
    columns:
      - name: event_id
        tests:
          - not_null
          - unique
