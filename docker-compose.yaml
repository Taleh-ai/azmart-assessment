x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/Dockerfile.app
  user: "${AIRFLOW_UID:-50000}:0"
  environment:
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-azmart}:${POSTGRES_PASSWORD:-azmart}@postgres/airflow_meta
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-azmart-local-jwt-secret}
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    PYTHONPATH: /opt/airflow
    PYTHONDONTWRITEBYTECODE: "1"

    API_BASE_URL: http://mock-api:8080
    API_KEY: ${API_KEY:-azcon-de-2026}
    DATASET_DIR: /opt/airflow/candidate_package/dataset

    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_USER: ${POSTGRES_USER:-azmart}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-azmart}
    POSTGRES_DB: azmart
    WAREHOUSE_DSN: postgresql://${POSTGRES_USER:-azmart}:${POSTGRES_PASSWORD:-azmart}@postgres/azmart

    DBT_BIN: /home/airflow/.local/bin/dbt
    DBT_OL_BIN: /home/airflow/.local/bin/dbt-ol
    SODA_BIN: /home/airflow/.local/bin/soda

    OPENLINEAGE_URL: http://marquez-api:5000
    OPENLINEAGE_NAMESPACE: azmart
    DBT_PROFILES_DIR: /opt/airflow/dbt_project
    DBT_TARGET_PATH: /opt/airflow/dbt_state/target
    DBT_LOG_PATH: /opt/airflow/dbt_state/logs
    DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./ingestion:/opt/airflow/ingestion:ro
    - ./candidate_package:/opt/airflow/candidate_package:ro
    - ./soda:/opt/airflow/soda:ro
    - ./dbt_project:/opt/airflow/dbt_project
    - ./evidence:/opt/airflow/evidence
    - ./analytics:/opt/airflow/analytics
    - airflow-logs:/opt/airflow/logs
    - dbt-state:/opt/airflow/dbt_state

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-azmart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-azmart}
      POSTGRES_DB: azmart
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-azmart} -d azmart"]
      interval: 5s
      timeout: 5s
      retries: 12

  mock-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8008:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12

  airflow-init:
    <<: *airflow-common
    depends_on:
      postgres:
        condition: service_healthy
    command: db migrate
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    depends_on:
      airflow-apiserver:
        condition: service_healthy
      mock-api:
        condition: service_healthy
    command: scheduler
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    depends_on:
      airflow-apiserver:
        condition: service_healthy
    command: dag-processor
    restart: unless-stopped

  marquez-db:
    image: postgres:14-alpine
    profiles: ["lineage"]
    environment:
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
      POSTGRES_DB: marquez
    volumes:
      - marquez-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marquez"]
      interval: 5s
      timeout: 5s
      retries: 12

  marquez-api:
    image: marquezproject/marquez:0.51.1
    profiles: ["lineage"]
    depends_on:
      marquez-db:
        condition: service_healthy
    environment:
      MARQUEZ_PORT: 5000
      MARQUEZ_ADMIN_PORT: 5001
      POSTGRES_HOST: marquez-db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: marquez
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
    ports:
      - "127.0.0.1:5050:5000"
    restart: unless-stopped

  marquez-web:
    image: marquezproject/marquez-web:0.51.1
    profiles: ["lineage"]
    depends_on:
      - marquez-api
    environment:
      MARQUEZ_HOST: marquez-api
      MARQUEZ_PORT: 5000
      WEB_PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
  airflow-logs:
  dbt-state:
  marquez-data: