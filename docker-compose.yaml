services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-azmart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-azmart}
      POSTGRES_DB: azmart
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-azmart} -d azmart"]
      interval: 5s
      timeout: 5s
      retries: 12

  mock-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8008:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata: