services:
  mock-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8008:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12