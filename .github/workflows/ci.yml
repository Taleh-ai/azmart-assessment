name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check ingestion dags

  dag-and-dbt-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.app
          tags: azmart-app:ci
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: DAG import check
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/dags:/opt/airflow/dags \
            -v ${{ github.workspace }}/scripts:/opt/airflow/scripts \
            azmart-app:ci python /opt/airflow/scripts/check_dag_imports.py
      - name: dbt parse
        run: |
          if [ -f dbt_project/dbt_project.yml ]; then
            docker run --rm --entrypoint dbt \
              -e DBT_SEND_ANONYMOUS_USAGE_STATS=false \
              -v ${{ github.workspace }}/dbt_project:/opt/airflow/dbt_project \
              azmart-app:ci parse --project-dir /opt/airflow/dbt_project --profiles-dir /opt/airflow/dbt_project \
              --target-path /tmp/dbt_target --log-path /tmp/dbt_logs
          else
            echo "dbt_project.yml yoxdur, bu addim kecilir"
          fi

  deploy:
    if: github.event_name == 'push'
    runs-on: azmart
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/azmart-assessment
            git fetch origin
            git checkout main
            git reset --hard origin/main
            docker compose up -d --build
